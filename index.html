<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile: prevent scroll, zoom, and bounce -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- PWA / standalone mobile experience -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />

    <title>The Battle of Pets</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* Hard reset – eliminate ALL browser chrome that would allow scrolling */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;

        /* Prevent iOS rubber-band scroll */
        overscroll-behavior: none;
        -webkit-overflow-scrolling: none;

        /* Prevent text selection & callout menus during gameplay */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;

        /* Prevent tap highlights */
        -webkit-tap-highlight-color: transparent;

        background: #000;
        touch-action: none;
      }

      #game-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* Phaser injects a <canvas> – make it fill and crisp-pixel */
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
